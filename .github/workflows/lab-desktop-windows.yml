name: LAB Desktop Windows build

on:
  push:
    branches:
      - feat/lab-desktop-tauri
    paths:
      - 'react-app/**'
      - '.github/workflows/lab-desktop-windows.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'react-app/**'
      - '.github/workflows/lab-desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build web app
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Install and launch NSIS package
        shell: pwsh
        run: ../scripts/test-desktop-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LAB-Desktop-Windows-installer
          path: react-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
